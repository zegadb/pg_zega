[package]
name = "pg_zega-relay"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Delivers pg_zega's journal to Zega in commit order (APS 52)"
publish = false

[dependencies]
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
