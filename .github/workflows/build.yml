name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The Postgres image on both architectures Docker users have: amd64 (Linux,
  # Intel Macs) and arm64 (Apple Silicon, ARM Linux), each built natively and
  # each starting with pg_zega loaded.
  postgres-17:
    name: Postgres 17 (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and install on Postgres 17
        run: docker build --platform ${{ matrix.platform }} -t pg_zega:ci ./postgres
      - name: It starts with pg_zega loaded on ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test "$(docker image inspect pg_zega:ci --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
          docker run -d --name pg-ci -e POSTGRES_PASSWORD=ci-password -e ZEGA_PASSWORD=ci-zega pg_zega:ci
          for _ in $(seq 1 60); do
            version="$(docker exec pg-ci psql -U postgres -tAc "SELECT extversion FROM pg_extension WHERE extname = 'pg_zega'" 2>/dev/null || true)"
            if [ -n "$version" ]; then echo "pg_zega $version loaded on ${{ matrix.platform }}"; exit 0; fi
            sleep 2
          done
          docker logs pg-ci; exit 1

  # The relay image on both architectures, built natively; it runs and
  # prints its usage. The sync job below runs the journal test through it.
  relay-image:
    name: Relay image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform ${{ matrix.platform }} -t pg_zega-relay:ci ./relay
      - name: It runs on ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test "$(docker image inspect pg_zega-relay:ci --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
          docker run --rm pg_zega-relay:ci --help 2>&1 | grep -q '^usage: pg_zega-relay'

  # Both modes end to end on amd64, against Zega built from the commit in
  # zega-version: test.sql in precommit mode (test.sh), then the same file in
  # journal mode delivered by the relay image (test-journal.sh), which must
  # leave the same graph.
  sync:
    name: Sync tests (precommit and journal)
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Check out Zega at zega-version
        run: |
          set -euo pipefail
          git init -q zega-src
          git -C zega-src fetch -q --depth 1 https://github.com/zegadb/zega "$(cat zega-version)"
          git -C zega-src checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.96.0'
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build Zega and the relay image
        run: |
          set -euo pipefail
          cargo build --locked -p zega-cli --manifest-path zega-src/Cargo.toml
          sccache --show-stats
          docker build -t pg_zega-relay:ci ./relay
      - name: Precommit mode (test.sh)
        run: |
          set -euo pipefail
          printf 'pg_zega-test-token\n' > "$RUNNER_TEMP/token"
          # The container reaches the host through host-gateway, not loopback.
          zega-src/target/debug/zega-server start --data "$RUNNER_TEMP/zega" --host 0.0.0.0 --port 9342 \
            --token-file "$RUNNER_TEMP/token" > "$RUNNER_TEMP/zega.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/zega.pid"
          ./test.sh
          kill "$(cat "$RUNNER_TEMP/zega.pid")"
      - name: Journal mode (test-journal.sh), through the relay image
        run: |
          set -euo pipefail
          # The test passes paths under the checkout and reaches Postgres and
          # Zega on 127.0.0.1: the same paths and the host's network.
          cat > "$RUNNER_TEMP/relay" <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" pg_zega-relay:ci "$@"
          SH
          chmod +x "$RUNNER_TEMP/relay"
          ./test-journal.sh zega-src/target/debug/zega-server "$RUNNER_TEMP/relay"
