name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The Postgres image on both architectures Docker users have: amd64 (Linux,
  # Intel Macs) and arm64 (Apple Silicon, ARM Linux), each built natively and
  # each starting with pg_zega loaded.
  postgres-17:
    name: Postgres 17 (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted: this repo is public and self-hosted runners refuse
          # public repos (a fork PR must never run on our machines); hosted
          # runners are free for public repos (addiscorp/infra#34).
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: pg_zega-ci:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      CONTAINER: pg-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and install on Postgres 17
        run: docker build --platform ${{ matrix.platform }} -t "$IMAGE" ./postgres
      - name: It starts with pg_zega loaded on ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
          docker run -d --name "$CONTAINER" -e POSTGRES_PASSWORD=ci-password -e ZEGA_PASSWORD=ci-zega "$IMAGE"
          for _ in $(seq 1 60); do
            version="$(docker exec "$CONTAINER" psql -U postgres -tAc "SELECT extversion FROM pg_extension WHERE extname = 'pg_zega'" 2>/dev/null || true)"
            if [ -n "$version" ]; then echo "pg_zega $version loaded on ${{ matrix.platform }}"; exit 0; fi
            sleep 2
          done
          docker logs "$CONTAINER"; exit 1
      - name: Remove this job's container and image
        if: always()
        run: |
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker image rm "$IMAGE" >/dev/null 2>&1 || true

  # Both modes end to end on amd64, against the published Zega release named
  # in zega-version (vX.Y.Z, or vX.Y.Z-canary-<sha> to test an unreleased
  # change): test.sql in precommit mode (test.sh), then the same file in
  # journal mode delivered by pg_zega's delivery worker (test-journal.sh),
  # which must leave the same graph.
  sync:
    name: Sync tests (precommit and journal)
    runs-on: ubuntu-24.04 # GitHub-hosted, as above
    env:
      COMPOSE_PROJECT_NAME: pg-zega-sync-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Free ports for this job's Zega and Postgres
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          import socket
          ports = []
          for _ in range(2):
              s = socket.socket(); s.bind(("127.0.0.1", 0)); ports.append(s)
          print(f"ZEGA_TEST_PORT={ports[0].getsockname()[1]}")
          print(f"PG_ZEGA_TEST_PORT={ports[1].getsockname()[1]}")
          PY
      - name: Download Zega at zega-version
        run: |
          set -euo pipefail
          tag=$(cat zega-version)
          base="https://releases.zega.dev/$tag"
          mkdir -p zega-bin
          curl -fsSL "$base/manifest.json" -o zega-bin/manifest.json
          curl -fsSL "$base/zega-server-linux-x64" -o zega-bin/zega-server
          want=$(jq -er '.artifacts["zega-server-linux-x64"]' zega-bin/manifest.json)
          echo "$want  zega-bin/zega-server" | sha256sum -c -
          chmod +x zega-bin/zega-server
          zega-bin/zega-server --version
      - name: Precommit mode (test.sh)
        run: |
          set -euo pipefail
          printf 'pg_zega-test-token\n' > "$RUNNER_TEMP/token"
          # The container reaches the host through host-gateway, not loopback.
          zega-bin/zega-server start --data "$RUNNER_TEMP/zega" --host 0.0.0.0 --port "$ZEGA_TEST_PORT" \
            --token-file "$RUNNER_TEMP/token" > "$RUNNER_TEMP/zega.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/zega.pid"
          ./test.sh
          kill "$(cat "$RUNNER_TEMP/zega.pid")"
      - name: Journal mode (test-journal.sh)
        run: ./test-journal.sh zega-bin/zega-server
