name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The Postgres image on both architectures Docker users have: amd64 (Linux,
  # Intel Macs) and arm64 (Apple Silicon, ARM Linux), each built natively and
  # each starting with pg_zega loaded.
  postgres-17:
    name: Postgres 17 (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and install on Postgres 17
        run: docker build --platform ${{ matrix.platform }} -t pg_zega:ci ./postgres
      - name: It starts with pg_zega loaded on ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test "$(docker image inspect pg_zega:ci --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
          docker run -d --name pg-ci -e POSTGRES_PASSWORD=ci-password -e ZEGA_PASSWORD=ci-zega pg_zega:ci
          for _ in $(seq 1 60); do
            version="$(docker exec pg-ci psql -U postgres -tAc "SELECT extversion FROM pg_extension WHERE extname = 'pg_zega'" 2>/dev/null || true)"
            if [ -n "$version" ]; then echo "pg_zega $version loaded on ${{ matrix.platform }}"; exit 0; fi
            sleep 2
          done
          docker logs pg-ci; exit 1

  # Both modes end to end on amd64, against the published Zega release named
  # in zega-version (vX.Y.Z, or vX.Y.Z-canary-<sha> to test an unreleased
  # change): test.sql in precommit mode (test.sh), then the same file in
  # journal mode delivered by pg_zega's delivery worker (test-journal.sh),
  # which must leave the same graph.
  sync:
    name: Sync tests (precommit and journal)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Zega at zega-version
        run: |
          set -euo pipefail
          tag=$(cat zega-version)
          base="https://releases.zega.dev/$tag"
          mkdir -p zega-bin
          curl -fsSL "$base/manifest.json" -o zega-bin/manifest.json
          curl -fsSL "$base/zega-server-linux-x64" -o zega-bin/zega-server
          want=$(jq -er '.artifacts["zega-server-linux-x64"]' zega-bin/manifest.json)
          echo "$want  zega-bin/zega-server" | sha256sum -c -
          chmod +x zega-bin/zega-server
          zega-bin/zega-server --version
      - name: Precommit mode (test.sh)
        run: |
          set -euo pipefail
          printf 'pg_zega-test-token\n' > "$RUNNER_TEMP/token"
          # The container reaches the host through host-gateway, not loopback.
          zega-bin/zega-server start --data "$RUNNER_TEMP/zega" --host 0.0.0.0 --port 9342 \
            --token-file "$RUNNER_TEMP/token" > "$RUNNER_TEMP/zega.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/zega.pid"
          ./test.sh
          kill "$(cat "$RUNNER_TEMP/zega.pid")"
      - name: Journal mode (test-journal.sh)
        run: ./test-journal.sh zega-bin/zega-server
