name: publish

# addiscorp/pg_zega:17, :0.1 and :latest for linux/amd64 and linux/arm64
# (Apple Silicon Macs run arm64 images; Intel Macs and most Linux run amd64).
# Each architecture builds natively and is pushed by digest; merge tags both
# digests together and checks the tag lists exactly those two; readback pulls
# the tag on both architectures and starts it with pg_zega loaded.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Require the Docker Hub account name
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Set the release environment variable DOCKERHUB_USERNAME." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./postgres
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ vars.DOCKERHUB_USERNAME }}/pg_zega,push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pg-zega-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1

  merge:
    name: tags (both architectures)
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pg-zega-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Tag both digests as one image
        run: |
          set -euo pipefail
          image="$DOCKERHUB_USERNAME/pg_zega"
          docker buildx imagetools create \
            -t "$image:17" -t "$image:0.1" -t "$image:latest" \
            "$image@$(cat digests/amd64)" "$image@$(cat digests/arm64)"
      - name: Every tag lists both architectures
        run: |
          set -euo pipefail
          for tag in 17 0.1 latest; do
            docker buildx imagetools inspect "$DOCKERHUB_USERNAME/pg_zega:$tag" --raw > "index-$tag.json"
            python3 - "index-$tag.json" digests/amd64 digests/arm64 <<'PY'
          import json, sys
          index = json.load(open(sys.argv[1]))
          served = {f'{m["platform"]["os"]}/{m["platform"]["architecture"]}': m["digest"]
                    for m in index["manifests"] if m["platform"]["os"] != "unknown"}
          want = {"linux/amd64": open(sys.argv[2]).read().strip(), "linux/arm64": open(sys.argv[3]).read().strip()}
          assert served == want, f"{sys.argv[1]} serves {served}, expected {want}"
          print(sys.argv[1], "serves", served)
          PY
          done

  readback:
    name: read-back (${{ matrix.platform }})
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      # Pulled by tag from Docker Hub, as Simien's local stack pulls it.
      - name: Pull the tag and start it with pg_zega loaded
        run: |
          set -euo pipefail
          image="$DOCKERHUB_USERNAME/pg_zega:0.1"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
          docker run -d --name pg-readback -e POSTGRES_PASSWORD=readback -e ZEGA_PASSWORD=readback "$image"
          for _ in $(seq 1 60); do
            version="$(docker exec pg-readback psql -U postgres -tAc "SELECT extversion FROM pg_extension WHERE extname = 'pg_zega'" 2>/dev/null || true)"
            if [ -n "$version" ]; then echo "$image: pg_zega $version loaded on ${{ matrix.platform }}"; exit 0; fi
            sleep 2
          done
          docker logs pg-readback; exit 1
