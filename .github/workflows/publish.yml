name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Require the Docker Hub account name
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Set the release environment variable DOCKERHUB_USERNAME." >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Publish the Postgres image
        uses: docker/build-push-action@v6
        with:
          context: ./postgres
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/pg_zega:17
            ${{ vars.DOCKERHUB_USERNAME }}/pg_zega:0.1
            ${{ vars.DOCKERHUB_USERNAME }}/pg_zega:latest
      - name: Publish the Zega image
        uses: docker/build-push-action@v6
        with:
          context: ./zega
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/zega:0.2.0
            ${{ vars.DOCKERHUB_USERNAME }}/zega:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
